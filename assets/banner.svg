<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.25;
      stroke-width: 1;
    }
    
    /* Dynamic Animated Elements */
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, 30px) scale(1.15); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-50px, -25px) scale(1.2); }
      100% { transform: translate(0px, 0px) scale(1); }
    }
    @keyframes pulseCard {
      0%, 100% { opacity: 0.85; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }

    .orb-1 {
      animation: floatOrb1 9s ease-in-out infinite;
    }
    .orb-2 {
      animation: floatOrb2 11s ease-in-out infinite;
    }
    .dynamic-card {
      animation: pulseCard 5s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 6, 6;
      animation: dashCycle 2s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/>

  <!-- Background Grid Pattern -->
  <g class="grid-layer">
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="210" x2="1200" y2="210" class="grid-line" />
    <line x1="0" y1="280" x2="1200" y2="280" class="grid-line" />
    <line x1="0" y1="350" x2="1200" y2="350" class="grid-line" />
    
    <line x1="150" y1="0" x2="150" y2="420" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="420" class="grid-line" />
    <line x1="450" y1="0" x2="450" y2="420" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="420" class="grid-line" />
    <line x1="750" y1="0" x2="750" y2="420" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="420" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="420" class="grid-line" />
  </g>

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <g>
    <circle cx="180" cy="110" r="130" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="orb-1" />
    <circle cx="1020" cy="300" r="160" fill="#818cf8" opacity="0.15" filter="url(#glow)" class="orb-2" />
    <circle cx="650" cy="80" r="100" fill="#c084fc" opacity="0.1" filter="url(#glow)" class="orb-1" />
  </g>

  <!-- Dynamic Decorative Chart / Flow in Lower Right -->
  <g class="dynamic-card" transform="translate(850, 75)">
    <!-- Card Frame -->
    <rect width="290" height="170" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Mini Header -->
    <circle cx="24" cy="24" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="38" cy="24" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="52" cy="24" r="5" fill="#10b981" opacity="0.8"/>
    <text x="75" y="28" font-family="sans-serif" font-size="11" fill="#94a3b8" font-weight="600">LIVE PRICE COMPARISON</text>
    
    <!-- Price Comparison Graph Waves -->
    <path d="M 25 125 Q 75 75, 125 105 T 225 65 T 265 85" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M 25 140 Q 80 120, 135 130 T 215 95 T 265 110" fill="none" stroke="#34d399" stroke-width="2" opacity="0.75" />
    
    <!-- Lowest Deal Indicator -->
    <circle cx="225" cy="65" r="5" fill="#38bdf8" filter="url(#soft-glow)" />
    <rect x="180" y="38" width="85" height="20" rx="6" fill="#0369a1" />
    <text x="188" y="52" font-family="sans-serif" font-size="10" fill="#e0f2fe" font-weight="bold">-42% BEST DEAL</text>
  </g>

  <!-- Dynamic Animated Connecting Flow Line -->
  <path d="M 720 280 L 880 280 L 980 250" fill="none" stroke="#818cf8" stroke-width="2" class="flow-line" opacity="0.6" />

  <!-- FOREGROUND CONTENT: Guaranteed pristine visibility above all background dynamics -->
  
  <!-- Category Badge Pill -->
  <g transform="translate(80, 72)">
    <rect width="365" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <circle cx="20" cy="17" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="35" y="22" fill="#38bdf8" class="badge-text">⚡ CURATED AWESOME COLLECTION &amp; TOOLS</text>
  </g>

  <!-- Title (Foreground) -->
  <text x="80" y="165" fill="url(#primary-grad)" class="title-text" filter="url(#soft-glow)">E-Commerce Price Comparison</text>
  <text x="80" y="215" fill="#ffffff" class="title-text">&amp; Browser Shopping Tools 🛒</text>

  <!-- Subtitle (Foreground) -->
  <text x="80" y="265" class="subtitle-text">
    Open-Source Extensions, Deal Scrapers, Restock Trackers &amp; SaaS Platforms
  </text>

  <!-- Feature Pills Row -->
  <g transform="translate(80, 310)">
    <!-- Pill 1: Browser Extensions -->
    <rect x="0" y="0" width="180" height="36" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="16" y="23" fill="#cbd5e1" class="badge-text">🧩 Browser Extensions</text>

    <!-- Pill 2: Price History -->
    <rect x="195" y="0" width="160" height="36" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="210" y="23" fill="#cbd5e1" class="badge-text">📈 Price Trackers</text>

    <!-- Pill 3: Self-Hosted -->
    <rect x="370" y="0" width="160" height="36" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="386" y="23" fill="#cbd5e1" class="badge-text">🛡️ Privacy &amp; Self-Host</text>

    <!-- Pill 4: Coupon Finders -->
    <rect x="545" y="0" width="165" height="36" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="561" y="23" fill="#cbd5e1" class="badge-text">🏷️ Coupon Automations</text>

    <!-- Pill 5: Market Intelligence -->
    <rect x="725" y="0" width="175" height="36" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="741" y="23" fill="#cbd5e1" class="badge-text">📊 Price Intelligence</text>
  </g>
</svg>
